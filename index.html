<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>สทนช. ลงพื้นที่</title>
  <link rel="icon" type="image/png" href="assets/onwr-logo.png" />
  <link rel="apple-touch-icon" href="assets/onwr-logo.png" />
  <meta name="apple-mobile-web-app-title" content="สทนช. ลงพื้นที่" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Noto Sans Thai"', 'system-ui', 'sans-serif'] } } } };
  </script>

  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    #map { position: absolute; inset: 0; }
    .safe-top    { top:    calc(env(safe-area-inset-top) + 12px); }
    .safe-bottom { bottom: calc(env(safe-area-inset-bottom) + 16px); }
    .safe-pb     { padding-bottom: calc(env(safe-area-inset-bottom) + 16px); }

    /* ── ตัวตำแหน่งผู้ใช้ (จุดสีฟ้าแบบ Google Maps) ── */
    .me { width: 88px; height: 88px; position: relative; pointer-events: none; }
    .me .cone { position: absolute; inset: 0; opacity: 0; transition: opacity .3s; }
    .me.has-heading .cone { opacity: 1; }
    .me .dot {
      position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px;
      border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    .me .pulse {
      position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px;
      border-radius: 50%; background: rgba(26,115,232,.35); animation: pulse 2s ease-out infinite;
    }
    .me.stale .dot { background: #9aa0a6; }
    .me.stale .pulse { display: none; }
    @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }

    /* ป้ายชื่อทุ่ง */
    .tung-label {
      font: 600 calc(16px * var(--ls, 1))/1.2 "Noto Sans Thai", system-ui, sans-serif; color: #1f2937; white-space: nowrap;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; pointer-events: none; text-align: center;
    }
    /* --ls = ตัวคูณขนาดป้ายตามระดับซูม (ตั้งค่าใน app.js: labelScale) */
    /* ขอบขาวรอบตัวอักษร (mask) — เงา 8 ทิศ ให้ขอบคมทุกเบราว์เซอร์ */
    .water-label {
      font: 700 calc(13px * var(--ls, 1))/1.2 "Noto Sans Thai", system-ui, sans-serif; color: #0c4a6e; white-space: nowrap;
      pointer-events: none; text-align: center;
    }
    .river-label {
      font: 600 calc(14px * var(--ls, 1))/1 "Noto Sans Thai", system-ui, sans-serif; color: #1d4ed8; white-space: nowrap;
      pointer-events: none;
    }
    .water-label, .river-label {
      text-shadow: -2px -2px 0 #fff, 0 -2px 0 #fff, 2px -2px 0 #fff, 2px 0 0 #fff,
                   2px 2px 0 #fff, 0 2px 0 #fff, -2px 2px 0 #fff, -2px 0 0 #fff, 0 0 4px #fff;
    }
    .water-label .v { display: none; }
    .water-label .c { font-size: calc(12px * var(--ls, 1)); font-weight: 600; margin-top: 1px; }
    .stn-label {
      font: 700 calc(13px * var(--ls, 1))/1.2 system-ui, sans-serif; color: #9a3412; white-space: nowrap;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; pointer-events: none;
    }
    .stn-label .v { display: none; }
    .visit-label {
      font: 700 calc(13px * var(--ls, 1))/1.2 "Noto Sans Thai", system-ui, sans-serif; color: #991b1b; white-space: nowrap;
      pointer-events: none;
      text-shadow: -2px -2px 0 #fff, 0 -2px 0 #fff, 2px -2px 0 #fff, 2px 0 0 #fff,
                   2px 2px 0 #fff, 0 2px 0 #fff, -2px 2px 0 #fff, -2px 0 0 #fff;
    }
    .visit-label .c, .visit-label .v { display: none; }
    .prov-label {
      font: 600 calc(13px * var(--ls, 1))/1.2 "Noto Sans Thai", system-ui, sans-serif; color: #111827; white-space: nowrap;
      letter-spacing: .02em; pointer-events: none; text-align: center; opacity: .85;
      text-shadow: -1.5px -1.5px 0 #fff, 0 -1.5px 0 #fff, 1.5px -1.5px 0 #fff, 1.5px 0 0 #fff,
                   1.5px 1.5px 0 #fff, 0 1.5px 0 #fff, -1.5px 1.5px 0 #fff, -1.5px 0 0 #fff;
    }
    .prov-label .c, .prov-label .v { display: none; }
    .basin-label {
      font: 700 calc(14px * var(--ls, 1))/1.2 "Noto Sans Thai", system-ui, sans-serif; color: #0f766e; white-space: nowrap;
      letter-spacing: .03em; pointer-events: none; text-align: center;
      text-shadow: -2px -2px 0 #fff, 0 -2px 0 #fff, 2px -2px 0 #fff, 2px 0 0 #fff,
                   2px 2px 0 #fff, 0 2px 0 #fff, -2px 2px 0 #fff, -2px 0 0 #fff;
    }
    .basin-label .c, .basin-label .v { display: none; }
    #map .basin-label, #map .prov-label { pointer-events: auto; cursor: pointer; }
    .tung-label .c { font-size: calc(13px * var(--ls, 1)); font-weight: 600; margin-top: 1px; }
    .tung-label .c:empty, .water-label .c:empty, .stn-label .c:empty { display: none; }
    /* ค่าจาก Google Sheet ใต้ชื่อทุ่ง */
    .tung-label .v {
      display: inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 8px;
      background: rgba(255,255,255,.94); color: #1f2937; text-shadow: none;
      font-size: calc(13px * var(--ls, 1)); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.25);
    }
    .tung-label .v:empty { display: none; }
    .tung-label .v .k { color: #6b7280; font-weight: 400; }
    .tung-label .v .sep { color: #9ca3af; }

    /* เครื่องมือวัดระยะ */
    .m-vertex { width: 26px; height: 26px; display: grid; place-items: center; cursor: grab; touch-action: none; }
    .m-vertex::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--c); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
    .m-vertex.last::after { background: var(--c); border-color: #fff; }
    .m-mid { width: 24px; height: 24px; display: grid; place-items: center; cursor: grab; touch-action: none; }
    .m-mid::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 2px solid var(--c); opacity: .8; }
    .m-label {
      font: 600 12px/1 "Noto Sans Thai", system-ui, sans-serif; color: #111827; white-space: nowrap; pointer-events: none;
      background: #fff; border: 1.5px solid var(--c); border-radius: 6px; padding: 3px 6px; box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    #btnMeasure[aria-pressed="true"] { background: #1a73e8; color: #fff; }

    /* หน้าจัดวางภาพ (export designer) */
    #designer .seg { display: flex; background: #f3f4f6; border-radius: 999px; padding: 2px; }
    #designer .seg button { height: 32px; padding: 0 4px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #374151; white-space: nowrap; }
    #designer .seg button.seg-on { background: #1a73e8; color: #fff; }
    #designer .seg.justify-between button { flex: 1; padding: 0 4px; }
    #designer #dsTitleBg.seg-on { background: #1a73e8; color: #fff; }
    #designer #dsSettings.seg-on { background: #1a73e8; color: #fff; }
    #dsArea { background: #4b5563; }
    #dsZoom { position: absolute; transform-origin: 0 0; }
    #dsCanvas { pointer-events: none; transition: opacity .15s; }
    #dsSheet { height: var(--sh, 40%); }
    @media (min-width: 768px) { #dsSheet { height: auto; } }

    /* สวิตช์เปิด/ปิด */
    .switch { position: relative; width: 44px; height: 26px; flex: none; }
    .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: #d1d5db; transition: background .2s; }
    .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .2s; }
    .switch input:checked + span { background: #1a73e8; }
    .switch input:checked + span::after { transform: translateX(18px); }
    .switch input:focus-visible + span { outline: 2px solid #1a73e8; outline-offset: 2px; }

    /* แผงด้านล่าง (มือถือ) ↔ แผงด้านข้าง (แท็บเล็ต) */
    .sheet { transition: transform .28s cubic-bezier(.2,.8,.2,1); }
    .sheet.closed { transform: translateY(110%); }
    @media (min-width: 768px) { .sheet.closed { transform: translateX(-110%); } }

    .maplibregl-ctrl-bottom-left  { bottom: env(safe-area-inset-bottom); }
    .maplibregl-ctrl-bottom-right { bottom: env(safe-area-inset-bottom); }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    input[type=range] { accent-color: #1a73e8; }
  </style>
</head>
<body class="font-sans bg-gray-100 text-gray-900 select-none">
  <div id="map"></div>

  <!-- ด้านบนซ้าย: โลโก้ สทนช. + เครื่องมือวัดระยะ + ปุ่มลงพื้นที่ + อยู่ในทุ่งไหน -->
  <div class="absolute safe-top left-3 right-[76px] md:right-auto md:w-[380px] flex flex-col gap-2 pointer-events-none z-10">
    <div class="flex items-center gap-2 mb-1 min-w-0">
      <img id="onwrLogo" src="assets/onwr-logo.png" alt="สำนักงานทรัพยากรน้ำแห่งชาติ (สทนช.)"
        class="flex-none w-12 h-auto drop-shadow-[0_1px_3px_rgba(255,255,255,0.9)] select-none" draggable="false" />
      <!-- ลุ่มน้ำที่เน้นอยู่ (แตะชื่อ = ซูมไป · ปุ่มกลาง = รอบนอกขาวทึบ/ขาวจาง · ✕ = เลิกเน้น) -->
      <div id="focusChip" class="hidden pointer-events-auto min-w-0 items-center bg-white rounded-full shadow-md h-9 pl-1 pr-0.5 text-sm">
        <button id="focusChipName" class="min-w-0 flex items-center gap-1.5 h-9 pl-2 pr-1 font-semibold text-teal-800">
          <svg class="w-4 h-4 flex-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="4 2.5"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/></svg>
          <span class="truncate"></span></button>
        <button id="focusChipFade" aria-pressed="false" class="w-8 h-8 flex-none rounded-full grid place-items-center text-teal-800 active:bg-gray-100">
          <svg data-solid class="w-[18px] h-[18px]" viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="3" fill="#fff" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>
          <svg data-fade class="hidden w-[18px] h-[18px]" viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="3" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="currentColor"/></svg></button>
        <button id="focusChipClear" aria-label="เลิกเน้นลุ่มน้ำ" class="w-8 h-8 flex-none rounded-full grid place-items-center text-gray-500 active:bg-gray-100">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btnMeasure" aria-label="วัดระยะทาง" aria-pressed="false"
        class="pointer-events-auto w-12 h-12 flex-none rounded-full bg-white shadow-md grid place-items-center active:bg-gray-100">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h2v4h2V8h2v4h2V8h2v4h2V8h2v4h2V8h2v8z"/></svg>
      </button>
      <div id="zoneChip" class="hidden pointer-events-auto min-w-0 items-center gap-2 bg-white/95 backdrop-blur rounded-full shadow-md px-3 h-9 text-sm">
        <span id="zoneSwatch" class="flex-none"></span>
        <span class="truncate">คุณอยู่ใน <b id="zoneName"></b></span>
      </div>
    </div>
    <!-- ซูมไปยังจุดลงพื้นที่ -->
    <button id="btnVisits" aria-label="ซูมไปจุดลงพื้นที่"
      class="pointer-events-auto self-start w-12 h-12 flex-none rounded-full bg-white shadow-md grid place-items-center active:bg-gray-100">
      <svg class="w-6 h-6" viewBox="0 0 24 24"><path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" fill="#dc2626" stroke="#dc2626" stroke-width="1.2" stroke-linejoin="round"/></svg>
    </button>
    <!-- export ภาพแผนที่ A2/A3 -->
    <button id="btnExport" aria-label="บันทึกภาพแผนที่ A2/A3"
      class="pointer-events-auto self-start w-12 h-12 flex-none rounded-full bg-white shadow-md grid place-items-center active:bg-gray-100">
      <svg class="w-6 h-6 text-gray-700" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
    </button>

    <!-- เน้นพื้นที่: ลุ่มน้ำหลัก / จังหวัด (รอบนอกขาวทึบ/ขาวจาง) -->
    <button id="btnFocus" aria-haspopup="menu" aria-label="เลือกพื้นที่"
      class="pointer-events-auto self-start w-12 h-12 flex-none rounded-full bg-white text-gray-700 shadow-md grid place-items-center active:opacity-80">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="3" stroke-dasharray="4 2.6"/><path d="M8 15.5l2.2-6 3 3.2 2.8-3.2v6z" fill="currentColor" stroke="none"/></svg>
    </button>

    <!-- แผงวัดระยะ -->
    <div id="measurePanel" class="hidden pointer-events-auto bg-white rounded-2xl shadow-lg p-3">
      <div class="flex items-center gap-2">
        <span id="measureSwatch" class="w-3 h-3 rounded-full flex-none"></span>
        <div class="flex-1 min-w-0">
          <div id="measureTotal" class="text-xl font-semibold tabular-nums leading-tight">0 ม.</div>
          <div id="measureHint" class="text-xs text-gray-500 leading-tight truncate">แตะแผนที่เพื่อเพิ่มจุด</div>
        </div>
        <button id="btnMeasureUndo" aria-label="ย้อนจุดล่าสุด" class="w-10 h-10 rounded-full grid place-items-center text-gray-700 active:bg-gray-100">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
        </button>
        <button id="btnMeasureClear" aria-label="ล้างทั้งหมด" class="w-10 h-10 rounded-full grid place-items-center text-red-600 active:bg-red-50">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </button>
        <button id="btnMeasureNew" aria-label="เริ่มเส้นใหม่" class="h-10 px-3 rounded-full bg-blue-600 text-white text-sm font-medium flex items-center gap-1 active:bg-blue-700">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>เส้นใหม่
        </button>
      </div>
      <div id="measureList" class="flex flex-wrap gap-1.5 mt-2 empty:hidden"></div>
    </div>
  </div>

  <!-- ปุ่มด้านขวา -->
  <div class="absolute right-3 safe-top flex flex-col gap-3 z-10">
    <button id="btnLayers" aria-label="ชั้นข้อมูล" class="w-12 h-12 rounded-full bg-white shadow-md grid place-items-center active:bg-gray-100">
      <svg class="w-6 h-6 text-gray-700" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg>
    </button>
    <button id="btnCompass" aria-label="หันทิศเหนือ" class="w-12 h-12 rounded-full bg-white shadow-md grid place-items-center active:bg-gray-100 transition-opacity">
      <svg id="compassNeedle" class="w-7 h-7" viewBox="0 0 24 24">
        <path d="M12 2l4 10h-8z" fill="#ea4335"/><path d="M12 22l-4-10h8z" fill="#9aa0a6"/>
      </svg>
    </button>
    <div id="zoomBox" class="w-12 rounded-full bg-white shadow-md flex flex-col overflow-hidden">
      <button id="btnZoomIn" aria-label="ซูมเข้า" class="h-12 grid place-items-center active:bg-gray-100">
        <svg class="w-6 h-6 text-gray-700" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <div class="h-px mx-2 bg-gray-200"></div>
      <button id="btnZoomOut" aria-label="ซูมออก" class="h-12 grid place-items-center active:bg-gray-100">
        <svg class="w-6 h-6 text-gray-700" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13H5v-2h14v2z"/></svg>
      </button>
    </div>
  </div>

  <!-- ปุ่มเริ่มบันทึกเส้นทาง -->
  <button id="btnRecord" aria-label="บันทึกเส้นทาง"
    class="absolute right-4 safe-bottom z-10 w-12 h-12 rounded-full bg-white shadow-lg grid place-items-center active:bg-gray-100 mb-[92px]">
    <span class="w-4 h-4 rounded-full bg-red-600 ring-4 ring-red-100"></span>
  </button>

  <!-- แถบควบคุมขณะบันทึก -->
  <div id="recBar" class="hidden absolute left-3 right-[84px] md:right-auto md:w-[360px] safe-bottom mb-6 z-10 h-14 rounded-full bg-white shadow-lg items-center gap-2 pl-4 pr-1.5">
    <span id="recDot" class="w-3 h-3 rounded-full flex-none bg-red-600 animate-pulse"></span>
    <div class="flex-1 min-w-0 leading-tight">
      <div id="recTime" class="font-semibold tabular-nums truncate">00:00:00</div>
      <div id="recDist" class="text-xs text-gray-500 tabular-nums truncate">0.00 กม.</div>
    </div>
    <button id="btnRecPause" aria-label="พักการบันทึก" class="w-11 h-11 rounded-full grid place-items-center bg-gray-100 text-gray-700 active:bg-gray-200"></button>
    <button id="btnRecStop" aria-label="หยุดบันทึก" class="w-11 h-11 rounded-full grid place-items-center bg-red-600 text-white active:bg-red-700">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
    </button>
  </div>

  <!-- ปุ่มติดตามตำแหน่ง -->
  <button id="btnLocate" aria-label="ตำแหน่งของฉัน"
    class="absolute right-3 safe-bottom z-10 w-14 h-14 rounded-full bg-white shadow-lg grid place-items-center active:bg-gray-100 mb-6">
    <svg id="icoLocate" class="w-7 h-7 text-gray-600" viewBox="0 0 24 24" fill="currentColor"></svg>
  </button>

  <!-- แผงชั้นข้อมูล -->
  <aside id="layerSheet"
    class="sheet closed fixed z-30 bg-white shadow-2xl flex flex-col
           left-0 right-0 bottom-0 max-h-[78dvh] rounded-t-2xl
           md:top-0 md:bottom-0 md:right-auto md:w-[360px] md:max-h-none md:rounded-none md:rounded-r-2xl">
